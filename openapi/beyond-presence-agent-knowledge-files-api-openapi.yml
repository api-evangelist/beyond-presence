                  type: missing
        '429':
          description: A plan limit has been exceeded, either the usage limit or the number of concurrent sessions.
          content:
            application/json:
              examples:
                usage:
                  summary: Usage limit exceeded
                  value:
                    detail: Usage limit exceeded. Please upgrade your plan.
                concurrency:
                  summary: Concurrency limit exceeded
                  value:
                    detail: You have reached your concurrency limit. Please upgrade your plan or stop other ongoing sessions.
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/knowledge-files/{id}/submit:
    post:
      tags:
      - Agent Knowledge Files
      summary: Submit Knowledge File
      description: 'Finalize a chunked knowledge file upload.


        Assembles the uploaded chunks and starts extracting and indexing them.

        Returns the file as `processing`; it becomes `available` once that

        finishes, which takes minutes for a long document.'
      operationId: submit_knowledge_file_v1_knowledge_files__id__submit_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Knowledge File ID.
          title: Id
        description: Knowledge File ID.
      responses:
        '200':
          description: Processed Knowledge File
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeFileResponse'
        '401':
          description: Authentication failed. The `x-api-key` header is missing or the provided API key is invalid.
          content:
            application/json:
              examples:
                missing:
