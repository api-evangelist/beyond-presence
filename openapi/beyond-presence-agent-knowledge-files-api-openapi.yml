  /v1/knowledge-files/{id}/upload:
    put:
      tags:
      - Agent Knowledge Files
      summary: Upload Knowledge File Chunk
      description: 'Upload a single chunk of a PDF knowledge file.


        Send the raw chunk bytes as the request body. Chunks are zero-indexed via

        the `chunk_number` query parameter and can be uploaded in any order.'
      operationId: upload_knowledge_file_chunk_v1_knowledge_files__id__upload_put
      security:
      - APIKeyHeader: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Knowledge File ID.
          title: Id
        description: Knowledge File ID.
      - name: chunk_number
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
          description: Chunk number, starting from 0.
          title: Chunk Number
        description: Chunk number, starting from 0.
      responses:
        '204':
          description: Successful Response
        '401':
          description: Authentication failed. The `x-api-key` header is missing or the provided API key is invalid.
          content:
            application/json:
              examples:
                missing:
                  summary: Missing API key
                  value:
                    detail: API key is required.
                invalid:
                  summary: Invalid API key
                  value:
                    detail: Invalid API key.
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API key is valid but not permitted to perform this action, either because the resource belongs to someone else or because the requested feature requires a plan upgrade.
          content:
            application/json:
              examples:
                permission:
                  summary: Not permitted
                  value:
                    detail: You do not have permission to access this resource.
                plan:
                  summary: Plan upgrade required
                  value:
                    detail: This feature is not available on your current plan. Please upgrade your plan.
              schema:
