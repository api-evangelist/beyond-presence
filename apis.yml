aid: beyond-presence
name: Beyond Presence
description: >-
  Beyond Presence (brand "bey") is a Europe-based AI company building real-time
  conversational AI video agents and speech-to-video (S2V) technology. Its
  platform lets developers deploy hyper-realistic AI video avatars that respond
  in real time (sub-1.2s latency at up to 1080p) across HR, sales, support, and
  coaching use cases. Two products are exposed through one REST API at
  api.bey.dev: a Speech-to-Video API that turns audio streams into lifelike
  avatars over LiveKit, and a Managed Agents API that runs end-to-end
  conversational agents with knowledge files, external LLM/API configuration,
  and webhook events. Official Python and TypeScript SDKs, an OpenAPI spec, and
  GDPR / SOC 2 Type II compliance are published. Surfaced as an HV Capital
  portfolio company and enriched from its public developer surface.
