components:
  schemas:
    FailedKnowledgeFileResponse:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier of the object in the database.
          examples:
          - 01234567-89ab-cdef-0123-456789abcdef
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          examples:
          - Hitchhiker's Guide to the Galaxy
        format:
          $ref: '#/components/schemas/KnowledgeFileFormat'
        status:
          type: string
          const: failed
          title: Status
          default: failed
        reason:
          type: string
          title: Reason
      type: object
      required:
      - id
      - name
      - format
      - reason
      title: FailedKnowledgeFileResponse
      description: Response model for a knowledge file that could not be processed.
    AvailableKnowledgeFileResponse:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier of the object in the database.
          examples:
          - 01234567-89ab-cdef-0123-456789abcdef
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          examples:
          - Hitchhiker's Guide to the Galaxy
        format:
          $ref: '#/components/schemas/KnowledgeFileFormat'
        status:
          type: string
          const: available
          title: Status
          default: available
        text:
          type: string
          title: Text
          description: Text extracted from the file. Shortened to the start of the file when it is a large one; see `is_text_complete`.
        is_text_complete:
          type: boolean
          title: Is Text Complete
          description: Whether `text` is the whole file rather than the start of it. A large file is stored and searched in full either way; this only says how much of it this endpoint hands back.
      type: object
      required:
      - id
      - name
      - format
      - text
      - is_text_complete
      title: AvailableKnowledgeFileResponse
      description: Response model for an available knowledge file.
    CreateKnowledgeFileRequest:
      oneOf:
      - $ref: '#/components/schemas/CreateTextKnowledgeFileRequest'
      - $ref: '#/components/schemas/CreatePdfKnowledgeFileRequest'
      discriminator:
        propertyName: format
        mapping:
          pdf: '#/components/schemas/CreatePdfKnowledgeFileRequest'
          text: '#/components/schemas/CreateTextKnowledgeFileRequest'
    CreateTextKnowledgeFileRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          examples:
          - Hitchhiker's Guide to the Galaxy
        format:
          type: string
          const: text
          title: Format
        content:
          type: string
          maxLength: 250000
          minLength: 1
          title: Content
      type: object
      required:
      - name
      - format
      - content
      title: CreateTextKnowledgeFileRequest
      description: Request model for creating a text knowledge file.
    Page_KnowledgeFileResponse_:
      anyOf:
      - $ref: '#/components/schemas/HasMorePage_KnowledgeFileResponse_'
      - $ref: '#/components/schemas/NoMorePage_KnowledgeFileResponse_'
    ToUploadKnowledgeFileResponse:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier of the object in the database.
          examples:
          - 01234567-89ab-cdef-0123-456789abcdef
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          examples:
          - Hitchhiker's Guide to the Galaxy
        format:
          $ref: '#/components/schemas/KnowledgeFileFormat'
        status:
          type: string
          const: to-upload
          title: Status
          default: to-upload
      type: object
      required:
      - id
      - name
      - format
      title: ToUploadKnowledgeFileResponse
      description: Response model for a knowledge file that is to be uploaded.
    KnowledgeFileFormat:
      type: string
      enum:
      - text
      - pdf
      title: KnowledgeFileFormat
      description: Format of the knowledge file.
    CreatePdfKnowledgeFileRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          examples:
          - Hitchhiker's Guide to the Galaxy
        format:
          type: string
          const: pdf
          title: Format
        upload_num_chunks:
          type: integer
          maximum: 1000.0
          exclusiveMinimum: 0.0
          title: Upload Num Chunks
      type: object
      required:
      - name
      - format
      - upload_num_chunks
      title: CreatePdfKnowledgeFileRequest
      description: Request model for creating a PDF knowledge file.
    ProcessingKnowledgeFileResponse:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier of the object in the database.
          examples:
          - 01234567-89ab-cdef-0123-456789abcdef
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          examples:
          - Hitchhiker's Guide to the Galaxy
        format:
          $ref: '#/components/schemas/KnowledgeFileFormat'
        status:
          type: string
          const: processing
          title: Status
          default: processing
      type: object
      required:
      - id
      - name
      - format
      title: ProcessingKnowledgeFileResponse
      description: Response model for a knowledge file that is still being processed.
    NoMorePage_KnowledgeFileResponse_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/KnowledgeFileResponse'
          type: array
          title: Data
          description: List of objects.
        has_more:
          type: boolean
          const: false
          title: Has More
          description: Whether there are more objects to fetch.
          default: false
      type: object
      required:
      - data
      title: NoMorePage[KnowledgeFileResponse]
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: Human-readable description of the error.
          examples:
          - Invalid API key.
      type: object
      required:
      - detail
      title: ErrorResponse
      description: 'Standard error response body.


        Carries a single human-readable `detail` message describing what went

        wrong. This is the shape of every error response except validation errors

        (`422`), which instead return a list of per-field error objects.'
    KnowledgeFileResponse:
      oneOf:
      - $ref: '#/components/schemas/ToUploadKnowledgeFileResponse'
      - $ref: '#/components/schemas/ProcessingKnowledgeFileResponse'
      - $ref: '#/components/schemas/AvailableKnowledgeFileResponse'
      - $ref: '#/components/schemas/FailedKnowledgeFileResponse'
      discriminator:
        propertyName: status
        mapping:
          available: '#/components/schemas/AvailableKnowledgeFileResponse'
          failed: '#/components/schemas/FailedKnowledgeFileResponse'
          processing: '#/components/schemas/ProcessingKnowledgeFileResponse'
          to-upload: '#/components/schemas/ToUploadKnowledgeFileResponse'
    HasMorePage_KnowledgeFileResponse_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/KnowledgeFileResponse'
          type: array
          title: Data
          description: List of objects.
        has_more:
          type: boolean
          const: true
          title: Has More
          description: Whether there are more objects to fetch.
          default: true
        next_cursor:
          type: string
          title: Next Cursor
          description: The cursor for the next page of objects.
      type: object
      required:
      - data
      - next_cursor
      title: HasMorePage[KnowledgeFileResponse]
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Your Beyond Presence API Key.
      in: header
      name: x-api-key
